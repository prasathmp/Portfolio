<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1017"/>
      <stop offset="50%" stop-color="#07090d"/>
      <stop offset="100%" stop-color="#040507"/>
    </linearGradient>

    <!-- Emerald Primary Gradient -->
    <linearGradient id="emerald-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Cyan Accent Gradient -->
    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Outer Ring Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base with Glow Border -->
  <rect x="20" y="20" width="472" height="472" rx="96" fill="url(#bg-grad)" stroke="url(#emerald-grad)" stroke-width="12"/>
  
  <!-- SEO Background Chart Bars (Widget Element) -->
  <g opacity="0.22">
    <rect x="75" y="340" width="34" height="80" rx="8" fill="#10b981"/>
    <rect x="125" y="280" width="34" height="140" rx="8" fill="#10b981"/>
    <rect x="175" y="220" width="34" height="200" rx="8" fill="#10b981"/>
    <rect x="225" y="160" width="34" height="260" rx="8" fill="#10b981"/>
  </g>

  <!-- SEO Search Magnifying Glass (Widget Element - Top Right) -->
  <g stroke="url(#cyan-grad)" stroke-width="14" fill="none" opacity="0.45">
    <circle cx="365" cy="145" r="48"/>
    <line x1="400" y1="180" x2="435" y2="215" stroke-linecap="round"/>
  </g>

  <!-- MP Monogram Letters (Bold Vector Paths) -->
  <!-- Letter M -->
  <path d="M 85 350 V 165 L 160 285 L 235 165 V 350" fill="none" stroke="url(#emerald-grad)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Letter P -->
  <path d="M 280 350 V 165 H 340 C 385 165 385 255 340 255 H 280" fill="none" stroke="url(#emerald-grad)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- SEO Upward Growth Arrow (Widget Accent Overlay) -->
  <g stroke="url(#emerald-grad)" stroke-width="16" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="200,380 260,330 320,360 415,240"/>
    <path d="M 370 240 L 415 240 L 415 285"/>
  </g>

  <!-- Organic Sparkle Node -->
  <circle cx="415" cy="240" r="12" fill="#34d399" filter="url(#glow)"/>
</svg>